[package]
name = "dev-report"
version = "0.9.4"
edition = "2021"
rust-version = "1.85"
readme = "README.md"
license = "Apache-2.0"

authors = [
    "James Gober <me@jamesgober.com>"
]

description = "Structured JSON reports for Rust verification tooling. Stable, versioned wire format with optional terminal, markdown, SARIF, and JUnit XML rendering. Foundation of the dev-* collection."

keywords = [
    "testing",
    "reporting",
    "sarif",
    "junit",
    "ci"
]

categories = [
    "development-tools",
    "development-tools::testing",
    "development-tools::debugging"
]

documentation = "https://docs.rs/dev-report"
repository = "https://github.com/jamesgober/dev-report"
homepage = "https://github.com/jamesgober/dev-report"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }

[features]
default = []
markdown = []
terminal = []
sarif = []
junit = []

[[example]]
name = "sarif_export"
required-features = ["sarif"]

[[example]]
name = "junit_export"
required-features = ["junit"]

[profile.release]
opt-level = 3
lto = "thin"
