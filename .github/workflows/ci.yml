name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Default features.
      - name: Build (default features)
        run: cargo build --verbose
      - name: Test (default features)
        run: cargo test --verbose

      # No-default-features build (pure schema).
      - name: Build (no default features)
        run: cargo build --no-default-features --verbose

      # All features (terminal + markdown).
      - name: Build (all features)
        run: cargo build --all-features --verbose
      - name: Test (all features)
        run: cargo test --all-features --verbose

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  docs:
    name: Doc build
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --all-features --no-deps

  msrv:
    name: MSRV (Rust 1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-features --verbose

  wire-format:
    name: Wire-format validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install jsonschema
        run: pip install jsonschema
      - name: Generate sample documents
        run: |
          mkdir -p target/wire-samples
          cargo run --example schema_sample --quiet > target/wire-samples/report.json
          cargo run --example schema_sample --quiet -- multi > target/wire-samples/multi.json
          cargo run --example sarif_export --features sarif --quiet > target/wire-samples/report.sarif.json
          cargo run --example junit_export --features junit --quiet > target/wire-samples/report.junit.xml
      - name: Validate JSON Schema (Report, MultiReport)
        run: |
          python scripts/validate_schema.py \
            schema/report.schema.json \
            target/wire-samples/report.json \
            target/wire-samples/multi.json
      - name: Validate SARIF 2.1.0 output
        run: python scripts/validate_sarif.py target/wire-samples/report.sarif.json
      - name: Validate JUnit XML output
        run: python scripts/validate_junit.py target/wire-samples/report.junit.xml
